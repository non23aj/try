<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Budget Manager</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
</head>
<body>
    <nav>
        <h1>Budget Manager</h1>
        <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="reports.html">Reports</a></li>
            <li><a href="goals.html">Goals</a></li>
            <li><a href="settings.html">Settings</a></li>
            <li><a href="transactions.html">Transactions</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="card">
            <h2>Income</h2>
            <p id="income">$0.00</p>
            <button class="btn open-modal" data-modal="incomeModal">Add Income</button>
        </div>
        
        <div class="card">
            <h2>Expenses</h2>
            <p id="expenses">$0.00</p>
            <button class="btn open-modal" data-modal="expenseModal">Add Expense</button>
        </div>

        <div class="card">
            <h2>Savings</h2>
            <p id="savings">$0.00</p>
        </div>
    </div>

    <!-- Income Modal -->
    <div class="modal" id="incomeModal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Add Income</h2>
            <input type="number" id="incomeInput" placeholder="Enter amount">
            <button class="btn" onclick="addIncome()">Save</button>
        </div>
    </div>

    <!-- Expense Modal -->
    <div class="modal" id="expenseModal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Add Expense</h2>
            <input type="number" id="expenseInput" placeholder="Enter amount">
            <button class="btn" onclick="addExpense()">Save</button>
        </div>
    </div>
</body>
</html>
