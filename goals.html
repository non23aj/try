<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goals | Budget Manager</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
</head>
<body>
    <nav>
        <h1>Budget Manager</h1>
        <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="reports.html">Reports</a></li>
            <li><a href="goals.html">Goals</a></li>
            <li><a href="settings.html">Settings</a></li>
        </ul>
    </nav>

    <div class="container">
        <h2>Financial Goals</h2>
        
        <div class="card">
            <h3>Set a New Goal</h3>
            <input type="text" id="goalName" placeholder="Goal name (e.g., Buy a car)">
            <input type="number" id="goalAmount" placeholder="Target amount ($)">
            <button class="btn" onclick="addGoal()">Add Goal</button>
        </div>

        <div class="card">
            <h3>My Goals</h3>
            <ul id="goalList"></ul>
        </div>
    </div>
</body>
</html>
